name: mirror

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup pages
        uses: actions/configure-pages@v5

      - name: Build mirror
        run: |
          mkdir -p _site
          cd _site
          BASE="https://conciencia-democratica.vercel.app"

          # Pages top-level
          for p in "" autores opinion letras archivo biblioteca multimedia origen glosario categorias status; do
            mkdir -p "./$p"
            curl -sL "$BASE/$p" -o "./$p/index.html" --max-time 30 || true
          done

          # Sitemap → artículos
          curl -sL "$BASE/sitemap.xml" -o sitemap.xml --max-time 30 || true
          if [ -s sitemap.xml ]; then
            grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed 's/<loc>//' | sed 's|</loc>||' | grep -E "(articulos|autores/|categoria/|temas/)" | sort -u | while read url; do
              path="${url#$BASE}"
              path="${path%%\?*}"
              [ -z "$path" ] && continue
              mkdir -p ".$path"
              curl -sL "$url" -o ".$path/index.html" --max-time 30 || true
              sleep 0.2
            done
          fi

          # Rewrite absolute → relative links
          find . -name '*.html' -exec sed -i 's|https://conciencia-democratica\.vercel\.app/|/|g' {} \;

          # robots.txt evitar indexar el mirror
          printf 'User-agent: *\nDisallow: /\n' > robots.txt

          echo "Páginas: $(find . -name index.html | wc -l) — tamaño: $(du -sh . | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        uses: actions/deploy-pages@v4
