name: mirror

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup pages
        uses: actions/configure-pages@v5

      - name: Build mirror
        shell: bash
        run: |
          mkdir -p _site
          cd _site
          BASE="https://conciencia-democratica.vercel.app"

          for p in "" autores opinion letras archivo biblioteca multimedia origen glosario categorias status; do
            mkdir -p "./$p"
            curl -sL "$BASE/$p" -o "./$p/index.html" --max-time 30 || true
          done

          curl -sL "$BASE/sitemap.xml" -o sitemap.xml --max-time 30 || true
          if [ -s sitemap.xml ]; then
            grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed 's/<loc>//' | sed 's|</loc>||' | grep -E "(articulos|autores/|categoria/|temas/)" | sort -u | while read url; do
              path="${url#$BASE}"
              path="${path%%\?*}"
              [ -z "$path" ] && continue
              mkdir -p ".$path"
              curl -sL "$url" -o ".$path/index.html" --max-time 30 || true
              sleep 0.2
            done
          fi

          find . -name '*.html' -exec sed -i 's|https://conciencia-democratica\.vercel\.app/|/|g' {} \;

          printf 'User-agent: *\nDisallow: /\n' > robots.txt

      - name: Inject banner via node
        shell: bash
        run: |
          cd _site
          node -e '
            const fs = require("fs");
            const path = require("path");
            const banner = `<div id="cd-mirror-banner" style="position:fixed;bottom:0;left:0;right:0;background:#7a1f1f;color:#fff;padding:10px 16px;font:13px/1.4 Georgia,serif;text-align:center;z-index:99999;box-shadow:0 -2px 8px rgba(0,0,0,0.15)"><span id="cd-mirror-msg">Estás viendo el archivo espejo del sitio. <a href="https://conciencia-democratica.vercel.app" style="color:#fff;text-decoration:underline">Probar el sitio principal &rarr;</a></span></div><script>(function(){var c=document.getElementById("cd-mirror-msg");if(!c)return;var ctrl=new AbortController();setTimeout(function(){ctrl.abort()},4000);fetch("https://conciencia-democratica.vercel.app/api/health",{cache:"no-store",signal:ctrl.signal}).then(function(r){if(r.ok){c.innerHTML="Sitio principal disponible. <a href="https://conciencia-democratica.vercel.app" style="color:#fff;text-decoration:underline">Ir al sitio en vivo &rarr;</a>";}else{c.innerHTML="El sitio principal está temporalmente fuera. Estás leyendo el archivo espejo. Las funciones interactivas (login, comentarios) no están disponibles acá.";}}).catch(function(){c.innerHTML="El sitio principal está temporalmente fuera. Estás leyendo el archivo espejo. Las funciones interactivas (login, comentarios) no están disponibles acá.";});})();</script>`;
            function walk(dir) {
              for (const e of fs.readdirSync(dir, {withFileTypes:true})) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) walk(p);
                else if (e.name.endsWith(".html")) {
                  const html = fs.readFileSync(p, "utf-8");
                  if (html.includes("cd-mirror-banner")) continue;
                  const updated = html.replace("</body>", banner + "</body>");
                  fs.writeFileSync(p, updated);
                }
              }
            }
            walk(".");
            console.log("Banner inyectado");
          '

      - name: Crear 404 personalizado
        shell: bash
        run: |
          cat > _site/404.html << 'EOF404'
          <!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="utf-8">
          <title>Página no disponible · Revista Conciencia Democrática</title>
          <meta name="robots" content="noindex">
          <style>
          body{font-family:Georgia,serif;background:#d9d6cf;color:#171717;margin:0;padding:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
          .box{max-width:560px;padding:48px 40px;background:#fff;border:1px solid rgba(122,31,31,0.18);box-shadow:0 4px 24px rgba(0,0,0,0.08);margin:24px}
          h1{font-size:28px;margin:0 0 8px;color:#7a1f1f;letter-spacing:1px}
          .subtitle{font-size:14px;color:#666;font-style:italic;margin:0 0 32px}
          .divider{width:48px;height:2px;background:#c9a96e;margin:24px 0}
          p{font-size:16px;line-height:1.65;margin:0 0 16px}
          a{color:#7a1f1f}
          .note{font-size:13px;color:#666;margin-top:32px;padding-top:24px;border-top:1px solid #eee}
          ul{padding-left:20px}
          li{margin-bottom:6px}
          </style>
          </head>
          <body>
          <div class="box">
          <h1>Página no encontrada</h1>
          <p class="subtitle">Revista Conciencia Democrática · Archivo espejo</p>
          <div class="divider"></div>
          <p>Esta página no existe en el archivo espejo, o el sitio principal todavía no la indexó.</p>
          <p>Probá una de estas secciones:</p>
          <ul>
          <li><a href="/">Inicio</a></li>
          <li><a href="/autores/">Autores</a></li>
          <li><a href="/opinion/">Opinión</a></li>
          <li><a href="/letras/">Letras</a></li>
          <li><a href="/archivo/">Archivo</a></li>
          </ul>
          <div class="note">
          <p>Si el sitio principal está disponible, podés ir a <a href="https://conciencia-democratica.vercel.app">conciencia-democratica.vercel.app</a> para acceder a la versión completa (login, comentarios, admin).</p>
          </div>
          </div>
          </body>
          </html>
          EOF404
          echo "404 creado"
          ls -la _site/404.html

      - name: Resumen
        run: |
          cd _site
          echo "Páginas: $(find . -name '*.html' | wc -l) — tamaño: $(du -sh . | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        uses: actions/deploy-pages@v4
